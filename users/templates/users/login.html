{% extends "base.html" %}
{% block content %}

<h2>Login</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST" autocomplete="off">
{% csrf_token %}

{{ form.as_p }}

<button type="submit" class="btn btn-success">Login</button>

</form>
<br>
<a href="{% url 'register' %}" class="text-danger">Don't have an account? Register</a>

{% endblock %}
