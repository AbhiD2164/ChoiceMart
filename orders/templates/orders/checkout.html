{% extends "base.html" %}

{% block content %}

<h2>Checkout</h2>

<div class="card p-4 shadow-sm">

{% for item in items %}

<div class="d-flex justify-content-between border-bottom py-2">

<div>
<b>{{item.product.name}}</b>
</div>

<div>
₹{{item.subtotal}}
</div>

</div>

{% endfor %}

<h4 class="mt-4">Total Payable: ₹{{total}}</h4>

<form method="POST" action="/payments/pay/{{order.id}}/">
{% csrf_token %}
<button class="btn btn-success mt-3">Pay Now</button>
</form>

</div>

{% endblock %}
