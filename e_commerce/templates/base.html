<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChoiceMart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<style>

body{
background:#f4f6fb;
font-family: 'Inter', sans-serif;
}

/* Header */
.hero-header{
background: linear-gradient(90deg,#0d6efd,#0052cc);
padding:20px 0;
color:white;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.brand-title{
font-size:36px;
font-weight:700;
}

.brand-tagline{
font-size:14px;
opacity:0.9;
}

.hero-flex{
display:flex;
justify-content:space-between;
align-items:center;
}

/* Cards */
.product-card{
border-radius:18px;
border:none;
transition:0.3s;
overflow:hidden;
}

.product-card:hover{
transform:translateY(-6px);
box-shadow:0 15px 30px rgba(0,0,0,0.12);
}

.product-img{
height:220px;
object-fit:contain;
background:white;
padding:15px;
}

/* Price */
.price{
font-size:20px;
font-weight:600;
}

.old-price{
text-decoration:line-through;
color:#ff4d4f;
}

.badge-bargain {
background:deeppink;
}

.badge-discount {
background:purple;
}

.badge-fixed {
background:seagreen;
}
/* Buttons */
.btn-main{
background:#5b6cff;
color:white;
border:none;
}

.btn-main:hover{
background:#4a5be0;
}

.cart-card{
border-radius:14px;
box-shadow:0 6px 15px rgba(0,0,0,0.08);
}

/* Sidebar */
.category-card{
position:sticky;
top:20px;
}

/* Animation */
.fade-up{
animation:fadeUp .5s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(20px)}
to{opacity:1; transform:translateY(0)}
}

</style>
</head>

<body>

<div class="hero-header">
<div class="container hero-flex">

<div>
<h1 class="brand-title">ChoiceMart</h1>
<p class="brand-tagline">Ask at your desired price online</p>
</div>

<div>
{% if user.is_authenticated %}
<a class="btn btn-light" title="₹{{ user.wallet.balance|floatformat:2 }}" onclick="alert('Wallet Balance: ₹{{ user.wallet.balance|floatformat:2 }}')">My Wallet</a>
<a href="/cart/" class="btn btn-light">Cart</a>
<a href="/users/logout/" class="btn btn-outline-light ms-2">Logout</a>
{% else %}
<a href="/admin/" class="btn btn-outline-light me-2">Admin</a>
<a href="/users/login/" class="btn btn-outline-light me-2">Login</a>
<a href="/users/register/" class="btn btn-light">Sign Up</a>
{% endif %}
</div>

</div>
</div>

<div class="container mt-4">

{% if messages %}
{% for message in messages %}
<div class="alert alert-info animate__animated animate__fadeInDown">
{{message}}
</div>
{% endfor %}
{% endif %}

{% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
