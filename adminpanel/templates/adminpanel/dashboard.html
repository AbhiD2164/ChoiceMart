<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #0d6efd, #0a58ca);
        }

        .sidebar h4 {
            font-weight: 600;
        }

        .sidebar a {
            text-decoration: none;   /* ✅ removes underline */
            color: white;
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .sidebar a:hover {
            background-color: rgba(255,255,255,0.2);
            padding-left: 18px;
        }

        .sidebar a.active {
            background-color: white;
            color: #0d6efd;
            font-weight: 600;
        }

        /* Cards */
        .card {
            border: none;
            border-radius: 12px;
        }

        .card h2 {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar text-white p-3">
        <h4>Admin Panel</h4>
        <hr>

        <a href="#" class="active">Dashboard</a>
        <a href="{% url 'admin_product_list' %}">Products</a>
        <a href="{% url 'admin_order_list' %}">Orders</a>
        <a href="{% url 'admin_user_list' %}">Users</a>
        <a href="{% url 'admin_logout' %}">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="container-fluid p-4">

        <h2 class="text-primary">Dashboard</h2>

        <div class="row mt-4">

            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Total Users</h5>
                    <h2>{{ total_users }}</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Total Orders</h5>
                    <h2>{{ total_orders }}</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Total Products</h5>
                    <h2>{{ total_products }}</h2>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
